function monthlyHousingAmount(m){return num(m.base)+num(m.extra)}
// Monthly forecast: existing monthly totals are cash paid, not separate loan principal records.
// A blank startMonth advances from the later of this month or the most recent paid month.
function addMonthOffset(yyyyMM,offset){
 const m=/^(\d{4})-(\d{2})$/.exec(String(yyyyMM||''));if(!m)return '';
 const d=new Date(Date.UTC(Number(m[1]),Number(m[2])-1+offset,1));
 return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');
}
function forecastMonthDate(yyyyMM,payDay){
 if(!yyyyMM)return '';
 const [y,m]=yyyyMM.split('-').map(Number);
 const last=new Date(Date.UTC(y,m,0)).getUTCDate();
 const chosen=payDay===31?last:Math.min(Math.max(payDay,1),last);
 return yyyyMM+'-'+String(chosen).padStart(2,'0');
}
function middleForecast(){
 const h=state.housing;
 const total=h.installments.filter(i=>i.type==='middle').reduce((v,i)=>v+num(i.amount),0);
 const paid=monthlyHousingSum()+extraMiddleDetailAmount();
 const remaining=Math.max(0,total-paid);
 const settings=h.forecast||{};
 const monthlyAmount=Math.max(0,num(settings.monthlyAmount??2500000));
 const lastRecorded=(h.monthlyPayments||[]).map(x=>String(x.month||'')).filter(x=>/^\d{4}-(0[1-9]|1[0-2])$/.test(x)).sort().pop()||'';
 const baseMonth=[currentMonth(),lastRecorded].sort().pop();
 const autoStart=addMonthOffset(baseMonth,1);
 const requestedStart=/^\d{4}-(0[1-9]|1[0-2])$/.test(settings.startMonth||'')?settings.startMonth:autoStart;
 const startMonth=requestedStart<autoStart?autoStart:requestedStart;
 const day=Number(settings.paymentDay)===31?31:Math.max(1,Math.min(28,Math.round(num(settings.paymentDay||31))));
 const months=monthlyAmount>0&&remaining>0?Math.ceil(remaining/monthlyAmount):0;
 const finalMonth=months?addMonthOffset(startMonth,months-1):'';
 const endDate=months?forecastMonthDate(finalMonth,day):'';
 const lastAmount=months?remaining-(months-1)*monthlyAmount:0;
 return {total,paid,remaining,monthlyAmount,startMonth,autoStart,day,months,finalMonth,endDate,lastAmount};
}

function monthlyHousingExtra(){return (state.housing.monthlyPayments||[]).reduce((t,m)=>t+num(m.extra),0)}
function extraMiddleDetailAmount(){
 const recordedMonths=new Set((state.housing.monthlyPayments||[]).map(m=>m.month));
 return (state.housing.payments||[]).filter(p=>!recordedMonths.has(String(p.date||'').slice(0,7))&&state.housing.installments.some(i=>i.id===p.installmentId&&i.type==='middle')).reduce((sum,p)=>sum+num(p.actual??(num(p.nominal)-paymentDiscount(p))),0);
}

<section class="card setting-section"><h2>부부 데이터 공유 (선택)</h2><p>Supabase를 연결하면 두 사람의 입력이 같은 가계부에 반영돼요. 평소에는 4자리 PIN만 입력하고, 서버 계정은 최초 연결 시 인증해요.</p>${renderSyncPanel()}<div class="hint section-gap">금융정보 보호를 위해 실제 서버에는 이메일 계정의 강력한 비밀번호와 RLS 접근 제한이 필요해요. 이 PIN만으로 서버를 열 수는 없어요. 다른 기기에서 공유하려면 동일한 차곡 웹주소(HTTPS)로 접속하세요.</div></section>
<section class="card setting-section"><h2>데이터 백업 및 복구</h2><p>금융정보는 중요하니까 정기적으로 백업 파일을 보관해 주세요.</p><div class="action-row"><button class="btn btn-primary" data-action="export">↓ 전체 JSON 백업</button><button class="btn" data-action="restore">↑ 백업 복구</button><button class="btn" data-action="exportCsv">↓ 거래 CSV</button></div><input id="restoreFile" class="hidden" type="file" accept=".json,application/json" style="display:none"><div class="hint section-gap">JSON 복구는 현재 데이터를 모두 교체합니다. 실수로 삭제했을 경우 복구 파일을 사용하세요. 다른 기기에서 로그인 없이 쓰려면 JSON 파일을 직접 옮겨 복구할 수 있어요.</div></section>
<section class="card setting-section"><h2>안내 · 개인정보</h2><p>명세서 파일과 글자 인식 원문은 브라우저에서 처리하고 저장하지 않습니다. 가져오기로 확정한 거래 행만 차곡에 보관합니다. Supabase를 직접 연결하기 전에는 저장한 거래가 이 기기에만 남습니다. 공유를 켜면 확정된 거래 정보와 자산/목표/중도금 현황이 설정한 Supabase 프로젝트에 저장됩니다.</p><div class="hint">엑셀(.xlsx/.xls), CSV, 캡처 이미지(PNG/JPG 등), PDF 명세서를 지원해요. PDF/이미지 글자 인식은 보이는 형식과 화질에 따라 오류가 날 수 있으므로 반드시 미리보기에서 금액과 날짜를 검토해 주세요. 은행 직접 연결은 지원하지 않습니다. 주식 종목별 매수·평가 금액은 주식 탭에서 관리할 수 있어요. 시세 자동 조회는 API 연결과 해당 시장의 데이터 이용권이 필요합니다.</div><div class="section-gap"><button class="btn btn-danger" data-action="resetAll">이 기기의 전체 데이터 초기화</button></div></section></div>`}
function renderSyncPanel(){const online=!!householdId,configured=!!(config.url&&config.key);if(!configured)return `<div class="hint">먼저 <strong>supabase.sql</strong>을 Supabase SQL Editor에서 실행하고 아래에 프로젝트 URL과 publishable/anon 키를 넣으세요. 서버용 secret/service_role 키는 절대 넣지 마세요.</div><div class="section-gap"><button class="btn btn-primary" data-action="setupSync">Supabase 연결 설정</button></div>`;if(!session)return `<div class="flex-between"><span class="tag orange">연결 설정됨 · 로그인 필요</span><button class="btn btn-sm" data-action="setupSync">연결 수정</button></div><div class="section-gap"><button class="btn btn-primary" data-action="login">이메일로 로그인 / 가입</button></div>`;if(!online)return `<span class="tag green">${safe(session.user.email||'로그인 완료')}</span><div class="section-gap"><p>공동 가계부를 새로 만들거나, 배우자가 공유한 초대 코드를 입력해 참여하세요.</p><div class="action-row"><button class="btn btn-primary" data-action="createHousehold">새 공동 가계부 만들기</button><button class="btn" data-action="joinHousehold">초대 코드로 참여</button></div></div><button class="btn-text section-gap" data-action="signOut">로그아웃</button>`;return `<div class="flex-between"><span class="tag green">공동 동기화 활성화</span><span class="auth-state">${safe(session.user.email||'')}</span></div><div class="hint section-gap">초대 코드는 한 번만 전달하세요. <strong>최대 2명</strong>만 같은 가계부에 참여할 수 있게 설정돼 있어요. ${dirty?'변경사항 동기화 중입니다.':'변경사항이 동기화됩니다.'}</div><div class="action-row section-gap"><button class="btn btn-primary" data-action="showInvite">초대 코드 보기</button><button class="btn" data-action="syncNow">지금 동기화</button><button class="btn" data-action="signOut">로그아웃</button></div>`}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalLayer').classList.remove('hidden');document.body.style.overflow='hidden';$('#modalBody').scrollTop=0;setTimeout(()=>$('#modalBody input:not([type=hidden]), #modalBody select')?.focus(),30)}
function closeModal(){$('#modalLayer').classList.add('hidden');$('#modalBody').innerHTML='';document.body.style.overflow='';editing=null;docImportRows=[];importRows=[];importHeaders=[];}
function footer(label='저장'){return `<div class="form-actions"><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn btn-primary">${label}</button></div>`}

function cardModal(item=null){const c=item||{owner:'me',name:'',issuer:'',payDay:31,openingDue:0};editing=c.id||null;openModal(item?'카드 정보 수정':'신용카드 등록',`<form id="cardForm"><div class="form-grid">${field('name','카드 이름',c.name,'text','required placeholder="예: 현대카드"')}${selectField('owner','사용자',ownerOpts(),c.owner)}${field('issuer','카드사',c.issuer,'text','placeholder="예: 현대카드"')}${selectField('payDay','매월 결제일',[...Array.from({length:30},(_,i)=>[i+1,`${i+1}일`]),[31,'말일']],c.payDay||31)}${field('openingDue','등록 시작 시 미결제 카드 잔액 (원)',c.openingDue??0,'number','min="0"')}</div><div class="hint">결제일만으로 카드 청구기간을 확정할 수는 없어요. ‘카드대금 납부’ 거래로 실제 결제금액을 반영하면 미결제 추정액이 줄어듭니다.</div>${footer()}</form>`)}
function transactionModal(item=null){const t=item||{date:now(),owner:'joint',kind:'expense',method:'account',amount:'',category:'식비',memo:'',accountId:'',toAccountId:'',cardId:'',affectsBalance:true};editing=t.id||null;openModal(item?'거래 수정':'수입 · 지출 · 이체 입력',`<form id="txnForm"><div class="field"><label>거래 종류</label><div class="radio-rail">${[['expense','지출'],['income','수입'],['transfer','자산 이동'],['card-payment','카드대금']].map(([k,l])=>`<label><input type="radio" name="kind" value="${k}" ${t.kind===k?'checked':''}><span>${l}</span></label>`).join('')}</div></div><div class="form-grid">${field('date','날짜',t.date,'date','required')}${selectField('owner','거래 주체',ownerOpts(),t.owner)}${field('amount','금액 (원)',t.amount,'number','required min="1" step="1"')}${selectField('method','결제 수단',[['account','계좌이체 · 통장'],['card','신용카드'],['cash','현금']],t.method)}<div id="txAccount">${selectField('accountId','출금 · 입금 자산',accountOpts(),t.accountId)}</div><div id="txCard">${selectField('cardId','사용 · 정산 카드',cardOpts(),t.cardId)}</div><div id="txTo">${selectField('toAccountId','이동할 자산',accountOpts(),t.toAccountId)}</div><div id="txCategory">${selectField('category','지출 분류',categories.map(c=>[c,c]),t.category)}</div><div class="full">${field('memo','내역 · 사용처',t.memo,'text','placeholder="예: 마트 장보기"')}</div></div><label style="display:flex;gap:8px;align-items:center;color:#617188;font-size:11px;font-weight:700"><input type="checkbox" name="affectsBalance" ${t.affectsBalance!==false?'checked':''}> 연결한 자산의 잔액에 반영하기</label><p class="mini-help">카드 사용은 자산에서 바로 차감되지 않고, 카드대금 납부 시 계좌에서 차감돼요.</p>${footer()}</form>`);updateTxnFields()}
function updateTxnFields(){const f=$('#txnForm');if(!f)return;const k=f.querySelector('[name=kind]:checked')?.value||'expense',m=f.querySelector('[name=method]')?.value||'account',set=(q,on)=>{const el=$(q);if(el)el.style.display=on?'':'none'};set('#txCard',(k==='expense'&&m==='card')||k==='card-payment');set('#txTo',k==='transfer');set('#txCategory',k==='expense');set('#txAccount',k==='transfer'||k==='income'||k==='card-payment'||(k==='expense'&&m!=='card'));f.querySelector('[name=method]').disabled=k==='transfer'||k==='card-payment'||k==='income';if(k==='card-payment'||k==='transfer'||k==='income')f.querySelector('[name=method]').value='account'}

  if(explicitOut&&explicitNum(explicitOut)){val={value:explicitNum(explicitOut)};flow='expense'}

  else if(vals.length>=3&&vals[0].value>0&&vals[1].value===0){val=vals[0];flow='expense'}
  else if(val.value<0||/출금|결제|지출|사용처|체크카드/.test(withoutDate)){flow='expense'}
  else if(/입금|급여|환급|이자지급|캐시백/.test(withoutDate)){flow='income'}

  let memo=withoutDate.replace(/\b\d{1,2}:\d{2}(?::\d{2})?\b/g,' ')
    .replace(/(?:₩\s*)?[-+]?\s*(?:\d{1,3}(?:,\d{3})+|\d{4,10})\s*원?/g,' ')
    .replace(/(?:잔액|거래금액|출금액|입금액|출금|입금|조회|원화|KRW)/g,' ')
    .replace(/[|\t]+/g,' ').replace(/\s+/g,' ').trim().slice(0,110);
  if(!memo)memo='내역 확인 필요';
  const cardHint=/카드대금|카드청구|카드결제대금|카드이용대금/.test(withoutDate);
  let kind=cardHint?'card-payment':flow;
  const warning=ambiguous||/이체|대체|송금|자동이체/.test(withoutDate)||memo==='내역 확인 필요';
  result.push({date,amount:String(amount),memo,kind,include:true,review:warning?'확인 필요':'',source:'document'});
 }

}

async function readImageText(file){

  img=await new Promise((resolve,reject)=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=()=>reject(new Error('이미지를 읽을 수 없어요.'));x.src=src});

async function readPdfText(file){
 docStatus('PDF 분석 준비 중…');await ensurePDFJS();
 const bytes=new Uint8Array(await file.arrayBuffer());let pdf;
 try{pdf=await pdfjsLib.getDocument({data:bytes}).promise}
 catch(e){try{bytes.fill(0)}catch(_){}throw new Error(/password/i.test(String(e))?'암호가 걸린 PDF는 먼저 잠금을 해제해 주세요.':'PDF를 열 수 없어요. '+e.message)}
 const maxPages=Math.min(pdf.numPages,8);const output=[];let worker=null;
 try{
  for(let n=1;n<=maxPages;n++){
   docStatus(`PDF ${n}/${maxPages}페이지 글자 확인 중…`);
   const page=await pdf.getPage(n);
   const textContent=await page.getTextContent();
   const items=(textContent.items||[]).filter(x=>x.str&&String(x.str).trim());
   let lines=[];
   for(const it of items){const y=Math.round(it.transform?.[5]||0),x=it.transform?.[4]||0;let line=lines.find(l=>Math.abs(l.y-y)<=3);if(!line){line={y,cols:[]};lines.push(line)}line.cols.push({x,str:it.str})}
   lines.sort((a,b)=>b.y-a.y);
   const pageText=lines.map(x=>x.cols.sort((a,b)=>a.x-b.x).map(it=>it.str).join(' ')).join('\n');
   if(pageText.replace(/\s/g,'').length>45){output.push(pageText);continue}
   docStatus(`스캔 PDF ${n}/${maxPages}페이지 OCR 처리 중…`);
   if(!worker)worker=await createOcrWorker();
   const viewport=page.getViewport({scale:Math.min(2,1900/Math.max(page.getViewport({scale:1}).width,page.getViewport({scale:1}).height))});
   const canvas=document.createElement('canvas');canvas.width=Math.round(viewport.width);canvas.height=Math.round(viewport.height);
   const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);
   await page.render({canvasContext:ctx,viewport}).promise;
   output.push(await ocrCanvas(canvas,worker));canvas.width=0;canvas.height=0;
  }
 }finally{if(worker)await worker.terminate();try{await pdf.destroy()}catch(e){}try{bytes.fill(0)}catch(e){}}
 if(pdf.numPages>maxPages)docStatus(`처음 ${maxPages}페이지만 읽었어요. 문서를 나누어 나머지를 올려주세요.`);
 return output.join('\n');
}

async function submitAuth(email,password,intent){if(!supabaseClient)return toast('먼저 Supabase 연결을 설정해 주세요.',true);try{const out=intent==='signup'?await supabaseClient.auth.signUp({email,password}):await supabaseClient.auth.signInWithPassword({email,password});if(out.error)throw out.error;closeModal();if(out.data?.session){session=out.data.session;await attachHousehold();toast('로그인했어요.')}else toast('이메일 인증을 완료한 다음 로그인해 주세요.');render()}catch(err){cloudError(err)}}
async function createHousehold(){if(!supabaseClient||!session)return;try{const {data,error}=await supabaseClient.rpc('create_household');if(error)throw error;householdId=(Array.isArray(data)?data[0]?.household_id:data?.household_id);if(!householdId)throw Error('공동 가계부 ID를 받지 못했어요.');remoteVersion=0;dirty=true;await saveRemote();render();toast('공동 가계부를 만들었어요! 배우자에게 초대 코드를 공유하세요.')}catch(err){cloudError(err)}}
async function joinHousehold(invite){if(!supabaseClient||!session)return;try{if(!/^[0-9a-f-]{36}$/i.test(invite))throw Error('올바른 초대 코드를 입력해 주세요.');if(state.accounts.length||state.transactions.length){if(!confirm('공동 가계부에 참여하면 이 기기에 있던 기존 데이터가 공동 데이터로 바뀝니다. 먼저 JSON 백업을 하셨나요?'))return}const {data,error}=await supabaseClient.rpc('join_household',{p_invite:invite});if(error)throw error;householdId=data;remoteVersion=-1;dirty=false;closeModal();await fetchRemote(false);render();toast('공동 가계부에 참여했어요!')}catch(err){cloudError(err)}}
async function showInvite(){try{const {data,error}=await supabaseClient.rpc('get_household_invite',{p_household_id:householdId});if(error)throw error;const code=String(data);openModal('배우자 초대 코드',`<p class="muted" style="font-size:12px">배우자가 같은 웹에 가입/로그인한 후 <strong>초대 코드로 참여</strong>를 선택하면 돼요.</p><div class="link-line">${safe(code)}</div><div class="action-row section-gap"><button class="btn btn-primary" data-action="copyInvite" data-code="${safe(code)}">초대 코드 복사</button><button class="btn" data-action="rotateInvite">코드 새로 발급</button></div><div class="warning section-gap">이 코드를 가진 사람이 먼저 참여할 수 있으므로 배우자에게만 보내세요. 코드는 두 번째 구성원이 들어오면 사용할 필요가 없습니다.</div>`)}catch(err){cloudError(err)}}
async function rotateInvite(){if(!confirm('기존 초대 코드를 무효화하고 새 코드를 만들까요?'))return;try{const {data,error}=await supabaseClient.rpc('rotate_household_invite',{p_household_id:householdId});if(error)throw error;closeModal();await showInvite();toast('초대 코드를 갱신했어요.')}catch(err){cloudError(err)}}
async function signOut(){if(dirty&&!confirm('동기화되지 않은 변경사항이 있어요. 로그아웃하면 이 기기의 미동기화 입력이 사라집니다. 그래도 진행할까요?'))return;if(!confirm('로그아웃할까요? 개인정보 보호를 위해 이 기기에 저장된 공동 가계부 캐시도 지웁니다.'))return;try{if(supabaseClient){const {error}=await supabaseClient.auth.signOut();if(error)throw error}householdId=null;session=null;remoteVersion=0;dirty=false;state=defaultData();localStorage.removeItem(KEY);setTab('settings');toast('로그아웃했어요.')}catch(err){cloudError(err)}}

// Daily Korean closing prices, not a real-time quote feed.
// Financial Services Commission public open API: keys are supplied by the end user.
const koreanStockCode=v=>{
 const match=String(v||'').trim().toUpperCase().match(/^(?:A)?(\d{6})(?::(?:KRX|KOSPI|KOSDAQ))?$/);
 return match?match[1]:'';
};
const quoteDate=v=>{const x=String(v||'').replace(/[^0-9]/g,'');return x.length===8?`${x.slice(0,4)}-${x.slice(4,6)}-${x.slice(6,8)}`:''};
async function fetchKoreanClosingPrices(code){
 const today=new Date();const before=new Date(today);before.setDate(today.getDate()-20);
 const dateKey=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d).replace(/-/g,'');
 const params=new URLSearchParams({serviceKey:krStockApiKey,numOfRows:'1000',pageNo:'1',resultType:'json',likeSrtnCd:code,beginBasDt:dateKey(before),endBasDt:dateKey(today)});
 const url='https://apis.data.go.kr/1160100/GetStockSecuritiesInfoService_V2/getStockPriceInfo_V2?'+params;
 let response;
 try{response=await fetch(url,{method:'GET',cache:'no-store',credentials:'omit'})}
 catch(e){throw Error('공공데이터 API에 브라우저에서 연결할 수 없어요(CORS/네트워크 차단 가능). 서버 프록시가 필요할 수 있어요.')}
 if(!response.ok)throw Error('공공데이터 API HTTP '+response.status);
 let data;try{data=await response.json()}catch(e){throw Error('API가 JSON으로 응답하지 않았어요. 인증키·활용신청 상태를 확인해 주세요.')}
 const hdr=data?.response?.header||data?.header||{};
 if(hdr.resultCode&&String(hdr.resultCode)!=='00'&&String(hdr.resultCode)!=='0')throw Error(String(hdr.resultMsg||hdr.resultCode).slice(0,100));
 let rows=data?.response?.body?.items?.item||data?.body?.items?.item||[];
 if(!Array.isArray(rows))rows=rows?[rows]:[];
 rows=rows.filter(x=>String(x.srtnCd||x.shortCode||'').replace(/^A/i,'')===code&&Number(x.clpr)>0)
 .sort((a,b)=>String(b.basDt).localeCompare(String(a.basDt)));
 if(!rows.length)throw Error('해당 6자리 종목코드의 최근 주식 종가가 없어요. 코드/ETF 여부를 확인해 주세요.');
 const close=Number(rows[0].clpr);
 const prev=rows.find(r=>String(r.basDt)<String(rows[0].basDt));
 let previous=prev?Number(prev.clpr):0;
 if(!previous&&Number.isFinite(Number(rows[0].vs)))previous=close-Number(rows[0].vs);
 return {price:close,previous:previous>0?previous:0,priceDate:quoteDate(rows[0].basDt)};
}
async function fetchOverseasClosingPrices(symbol){
 const url='https://api.twelvedata.com/time_series?'+new URLSearchParams({symbol,interval:'1day',outputsize:'2',apikey:stockApiKey});
 const resp=await fetch(url,{cache:'no-store'});if(!resp.ok)throw Error('HTTP '+resp.status);
 const data=await resp.json();if(data.status==='error'||!Array.isArray(data.values)||!data.values.length)throw Error(data.message||'해외 시세 정보 없음');
 const q=data.values[0],price=Number(q.close),previous=Number(data.values[1]?.close||0);
 if(!Number.isFinite(price)||price<=0)throw Error('종가 데이터 오류');
 return {price,previous,priceDate:String(q.datetime).slice(0,10)};
}
async function updateStockPrices(manual=false){
 const hs=state.holdings.filter(h=>h.symbol);
 if(!hs.length){if(manual)toast('먼저 종목을 등록하고 국내 주식 6자리 코드를 입력해 주세요.',true);return}
 const date=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});
 const pending=[...new Set(hs.filter(h=>manual||h.lastAttempt!==date).map(h=>h.symbol))].slice(0,20);
 if(!pending.length){if(manual)toast('오늘 이미 확인한 종목입니다.');return}
 let success=0,fail=[];
 if(manual)toast('국내 주식의 최근 확정 종가를 확인하는 중이에요.');
 for(const symbol of pending){
  const affected=state.holdings.filter(h=>h.symbol===symbol);
  const kr=affected.some(h=>h.currency==='KRW'),code=koreanStockCode(symbol);
  try{
   if(kr&&!code)throw Error('국내 주식은 6자리 종목코드를 입력해 주세요');
   if(kr&&!krStockApiKey)throw Error('시세 연결 설정에서 공공데이터 인증키를 입력해 주세요');
   if(!kr&&!stockApiKey)throw Error('해외주식용 Twelve Data 키가 필요해요');
   const q=kr?await fetchKoreanClosingPrices(code):await fetchOverseasClosingPrices(symbol);
   let updated=false;
   for(const h of affected){
    if(h.priceDate&&q.priceDate&&h.priceDate>q.priceDate){h.lastAttempt=date;continue}
    h.price=q.price;h.prevClose=q.previous;h.priceDate=q.priceDate;h.source='api';h.lastAttempt=date;updated=true;
   }
   if(updated)success++;
  }catch(err){for(const h of affected)h.lastAttempt=date;fail.push(symbol+': '+(err.message||'조회 실패'))}
 }
 if(success||fail.length){persist();if(tab==='stocks'||tab==='dashboard'||tab==='assets')render()}
 if(manual||fail.length)toast(`시세 조회: ${success}종목 성공${fail.length?', '+fail.length+'종목 실패':''}${fail.length?'. '+fail[0].slice(0,100):''}`,!!fail.length);
}

// 새로 열거나 새로고침하면 다시 입력하도록 세션 유지 값을 저장하지 않습니다.
const ACCESS_PIN='0402'; // 주의: HTML에 포함된 PIN이므로 보안 인증이 아닙니다.
let pinUnlocked=false, appInitialized=false;
function lockApp(){
 pinUnlocked=false;
 document.body.classList.add('pin-locked');
 const p=$('#pinInput'),e=$('#pinError');
 if(p)p.value='';if(e)e.textContent='';
 document.body.style.overflow='';
 window.scrollTo(0,0);
 setTimeout(()=>p?.focus(),20);
}
function unlockApp(event){
 event.preventDefault();
 const p=$('#pinInput'),e=$('#pinError');
 const entered=p?.value||'';
 if(entered!==ACCESS_PIN){
  if(e)e.textContent='비밀번호가 맞지 않아요. 다시 입력해 주세요.';
  if(p){p.value='';p.focus()}
  return;
 }
 if(e)e.textContent='';if(p)p.value='';
 pinUnlocked=true;document.body.classList.remove('pin-locked');
 if(!appInitialized){
  appInitialized=true;initEvents();
  $('#todayPill').textContent=new Date().toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',weekday:'short'});
  if(config.url&&config.key)initCloud();
  if((krStockApiKey||stockApiKey)&&state.holdings.length)updateStockPrices(false).catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
 }
 render();
}
function bootstrap(){
 $('#pinUnlockForm')?.addEventListener('submit',unlockApp);
 $('#pinLockTop')?.addEventListener('click',lockApp);
 $('#pinInput')?.focus();
}

// Debug/testing hook does not expose account access or secrets.
window.ChagokDocumentParser={parseStatementText:(text,year)=>parseStatementText(text,year)};
window.ChagokDiagnostics={version:"1.6-middle-forecast-sync",getSnapshot:()=>({accounts:state.accounts.length,transactions:state.transactions.length,goals:state.goals.length,holdings:state.holdings.length,assets:assetTotal(),spent:spent(),paid:state.housing.payments.length,monthlyPaid:monthlyHousingSum(),monthlyRows:state.housing.monthlyPayments.length}),prepayDiscount};
bootstrap();
})();
